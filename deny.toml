# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).
# Run locally with `cargo deny check`; CI runs the same in the `supply-chain` job.

[graph]
# Scan the feature-expanded graph, not just default features. The `parquet` and
# `binance` stacks are both off by default, and every exception below exists for a
# crate that only appears through one of them — without this the checks never saw
# those trees at all, and the exceptions sat unevaluated.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry here is mirrored in osv-scanner.toml with the same reasoning: the
# two files are read by different tools, so an advisory suppressed in only one is
# not suppressed at all, and Scorecard's Vulnerabilities check reads the OSV side.
#
# The zstd entries: zstd reaches this graph only through parquet 59 (the
# optional `parquet` stack), which depends on zstd with default features off and
# calls nothing but the `zstd::bulk` API -- one-shot `compress2` / `decompress`
# with a compression level. `cargo tree --all-features -e features` shows no zstd
# feature at all and only `std` on zstd-safe and zstd-sys, so the `experimental`,
# `seekable`, `zstdmt`, `zdict_builder` and `legacy` code paths are not compiled.
# Fixes exist only in zstd 0.14.3 and zstd-safe 8.2.0, which parquet 59 cannot
# take (`zstd ^0.13`, still so in 59.3.2); parquet 60 takes them and requires
# Rust 1.88. Remove these entries with the move to parquet 60. zstd-sys's own
# advisory (RUSTSEC-2026-0410) is fixed in the lock instead: 2.1.2 fits zstd-safe 7.
ignore = [
    { id = "RUSTSEC-2026-0391", reason = "zstd stream encoders/decoders built with_context; parquet 59 uses only the zstd::bulk API, never a stream or with_context. Remove with parquet 60." },
    { id = "RUSTSEC-2026-0395", reason = "CParameter::StableInBuffer needs zstd-safe's `experimental` feature, which is off (zstd-safe has only `std`); parquet sets only CompressionLevel. Remove with parquet 60." },
    { id = "RUSTSEC-2026-0396", reason = "Seekable seek-table reads need the `seekable` feature, which is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0397", reason = "OutBuffer::around_pos is called only by zstd's streaming code; parquet uses only the zstd::bulk API, whose compress2/decompress write through WriteBuf::write_from. Remove with parquet 60." },
    { id = "RUSTSEC-2026-0398", reason = "Seekable::decompress needs the `seekable` feature, which is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0399", reason = "CCtx::init_using_cdict / DCtx::init_using_ddict need the `experimental` feature, which is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0400", reason = "a one-shot call on a context with an unfinished stream; parquet's zstd::bulk contexts only ever run one-shot calls, never a stream. Remove with parquet 60." },
    { id = "RUSTSEC-2026-0401", reason = "train_from_buffer trains a dictionary; nothing in this graph trains one, and the `zdict_builder` feature is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0402", reason = "CCtx::try_clone needs the `experimental` feature and a `zstdmt` context, both off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0403", reason = "DCtx::decompress_stream on a failing legacy frame; parquet 59 uses only the zstd::bulk API, and the `legacy` feature is off (zstd runs with no features). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0404", reason = "DCtx::try_clone needs the `experimental` feature, which is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0405", reason = "SeekableCStream::compress_stream needs the `seekable` feature, which is off (zstd-safe has only `std`). Remove with parquet 60." },
    { id = "RUSTSEC-2026-0406", reason = "an unfinished multithreaded frame needs CParameter::NbWorkers on a C library built with `zstdmt`, which is off (zstd-safe has only `std`); parquet sets only CompressionLevel. Remove with parquet 60." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# Scoped license exceptions for individual permissive / public-domain crates:
#   - tiny-keccak (CC0-1.0): public-domain hashing, pulled in by the optional
#     `parquet` feature's arrow stack.
#   - webpki-roots (CDLA-Permissive-2.0): the Mozilla CA certificate bundle as
#     data, pulled in by the optional `binance` feature's rustls TLS stack.
# Both features are off by default; each exception is granted only to its crate.
exceptions = [
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates may be referenced by `path`, which reads as a wildcard
# requirement but is not an unpinned external dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
