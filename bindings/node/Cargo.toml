[package]
name = "wickra-backtest-node"
description = "Node.js bindings for the wickra-backtest streaming backtester."
version.workspace = true
edition.workspace = true
# napi-build requires a newer Rust than the workspace MSRV.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wickra-backtest-core.workspace = true
serde_json.workspace = true
napi = { version = "3.9", features = ["napi8"] }
napi-derive = "3.5"

[build-dependencies]
napi-build = "2"

# Not `workspace = true`: the `#[napi]` macro expands to `#[allow(unsafe_code)]`,
# which a workspace-level `forbid` cannot tolerate. `deny` is overridable, so the
# macro keeps working while hand-written unsafe still has to be argued for.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
