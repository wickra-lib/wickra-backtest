[package]
name = "wickra-backtest-c"
description = "C ABI for the wickra-backtest streaming backtester (the hub for Go, C#, Java, R, C/C++)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "wickra_backtest"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
wickra-backtest-core.workspace = true
serde_json.workspace = true

# Not `workspace = true`: this crate is the FFI boundary and needs `unsafe`, which
# the workspace forbids. The same lints are restated here so opting out of the
# forbid does not also opt out of everything else.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
