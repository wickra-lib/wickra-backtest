name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm / PyPI inside any build step (cargo,
  # napi, maturin, wasm-pack, npm ci, pip) retries automatically instead of
  # failing the job and needing a manual re-run. Cargo treats "couldn't resolve
  # host" / connect / timeout as spurious and retries with backoff; 10 attempts
  # ride out a transient DNS blip on a runner. Complements the setup-action /
  # cache retries (which only covered toolchain download + cache restore).
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin (which supplies the platform link flags); exclude it here.
      - run: cargo build --workspace --all-features --exclude wickra-backtest-python
      - run: cargo test --workspace --all-features --exclude wickra-backtest-python
      # examples/rust is a workspace member, so the two lines above already
      # compile it. Running it is the part that was missing: the example asserts
      # streaming and batch agree and exits non-zero when they do not, which
      # compiling alone never discovers.
      - run: cargo run -p wickra-backtest-examples

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # The Node binding (napi 3) requires Rust 1.88 and is checked separately
      # below; the Python binding needs maturin's platform link flags and is
      # built by the `python` job.
      - run: cargo build --workspace --exclude wickra-backtest-python --exclude wickra-backtest-node

  msrv-node:
    name: MSRV node binding (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - run: cargo build -p wickra-backtest-node

  binding-surface:
    name: Binding surface parity
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a static check; if it is not done in ten minutes it is stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ten language reaches sit on one C ABI, and each is tested separately. The
      # golden corpus compares values, so a binding that never grew a method has
      # no test to fail. This holds every language to the header instead.
      - name: Compare every binding's surface with the C ABI
        run: python3 scripts/check_binding_surface.py

      # The version lives in twenty-odd declarations across six package managers.
      # A bump that misses one ships a package pinning a binary that was never
      # published, and that surfaces on a user's machine after the tag.
      - name: Every version declaration agrees
        run: python3 scripts/check_version_sync.py

      # R is the one binding whose native half comes from a published release
      # rather than from this tree: bindings/r/configure downloads the C ABI for
      # the version DESCRIPTION names. The R job here builds against the header
      # in the tree, so it never sees that pairing -- r-universe does, days
      # later. This makes a mismatch visible in the pull request that opens it.
      - name: R wrapper against the released C ABI
        run: python3 scripts/check_r_abi_skew.py

  # An early heads-up on a broken link in a pull request. Deliberately
  # non-blocking: external link rot is non-deterministic, and a third-party site
  # rate-limiting must never fail someone's PR. The authoritative run is the
  # weekly schedule in links.yml.
  links:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "bindings/*/README.md"
          fail: true

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-deny
      - run: cargo deny check

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # abi3-py39 wheels ship for every version from 3.9 up, so the floor, the
        # current default and the newest each get a run rather than 3.12 alone.
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait before Python retry
        if: steps.setup_python.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-python failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Python (retry)
        if: steps.setup_python.outcome == 'failure'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Install Python dev dependencies
        shell: bash
        run: |
          # Hash-locked dev tooling (OpenSSF Scorecard PinnedDependencies).
          # Split by Python version: a resolution for 3.9 is not one for 3.13 --
          # 3.9 additionally needs the exceptiongroup, tomli and typing-extensions
          # backports. Refresh both with scripts/update-lockfiles.sh.
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      # The wheel this job just built, from disk with the network switched off.
      # There is no hash to pin it to: it does not exist until the line above
      # runs, and pinning one would mean committing a hash that changes with
      # every build.
      - run: pip install --no-index --find-links bindings/python/dist wickra-backtest
      - run: pytest bindings/python/tests -q
      # The example is what SUPPORT.md sends people to, so it is run against the
      # wheel this job just installed rather than left to rot.
      - run: python examples/python/backtest.py

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      # The binding links against the C ABI hub via cgo; build it first and stage
      # the platform library under bindings/go/lib so cgo's LDFLAGS find it.
      - name: Build the C ABI library
        run: cargo build -p wickra-backtest-c --release

      - name: Vendored header in sync with the C ABI
        shell: bash
        # bindings/go/include/wickra_backtest.h is a committed copy of the C ABI
        # header (the parent ../c/include is outside the Go module, so it must be
        # vendored). Fail if it drifts from the source of truth.
        run: |
          if ! diff -u bindings/c/include/wickra_backtest.h bindings/go/include/wickra_backtest.h; then
            echo "::error::bindings/go/include/wickra_backtest.h is stale — copy bindings/c/include/wickra_backtest.h over it"
            exit 1
          fi

      - name: Stage the native library
        shell: bash
        # Stage into lib/<goos>_<goarch>/ to match the per-platform cgo LDFLAGS.
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_backtest.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_backtest.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_backtest.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go examples/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and test the Go binding
        shell: bash
        # On Windows there is no rpath; the loader resolves wickra_backtest.dll via
        # PATH (WICKRA_GO_LIBDIR is the per-platform staged lib dir). Linux/macOS
        # use the rpath baked by the per-platform cgo LDFLAGS.
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

      # examples/go is a separate module that `replace`s the binding with this
      # tree's, so it is neither vetted nor built by the step above.
      - name: Vet and run the Go example
        shell: bash
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd examples/go
          go vet ./...
          go run .

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Set up Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - name: Wait before Node retry
        if: steps.setup_node.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-node failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Node (retry)
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install, not npm ci: the six per-platform optionalDependencies have
      # never been published, so they cannot be in the lockfile, and npm ci
      # refuses a lock that does not list them -- `EUSAGE ... Missing:
      # wickra-backtest-darwin-arm64@ from lock file`. Older npm tolerated it;
      # npm 12 does not, so this is not a matter of taste. It becomes possible
      # once the first release publishes those six packages.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      # --platform puts the target triple into the filename so the loader finds
      # the freshly built binary instead of a per-platform npm subpackage.
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      - name: Run Node tests
        run: cd bindings/node && node --test
      # The example requires ../../bindings/node directly, so it exercises the
      # module the tests just built through its published entry point.
      - name: Run the Node example
        run: node examples/node/backtest.js

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: wasm-pack
      # Build the nodejs target so the golden suite can require ../pkg/*.js.
      - name: Build WASM package (nodejs target)
        run: wasm-pack build bindings/wasm --target nodejs --release --out-dir pkg
      - name: Verify generated artefacts
        run: |
          test -f bindings/wasm/pkg/wickra_backtest_wasm.js
          test -f bindings/wasm/pkg/wickra_backtest_wasm_bg.wasm
          test -f bindings/wasm/pkg/wickra_backtest_wasm.d.ts
      - name: Golden parity tests (node)
        run: node --test bindings/wasm/tests/*.test.cjs
      # The browser demo cannot run headless here, but the CommonJS example
      # loads the same pkg/ build this job produced.
      - name: Run the WASM example
        run: node examples/wasm/backtest.cjs

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Install cbindgen
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-backtest-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-backtest-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check the committed header is in sync with cbindgen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cbindgen --config bindings/c/cbindgen.toml --crate wickra-backtest-c --output bindings/c/include/wickra_backtest.h
          if ! git diff --quiet -- bindings/c/include/wickra_backtest.h; then
            echo "::error::bindings/c/include/wickra_backtest.h is out of sync — run cbindgen and commit the result"
            git --no-pager diff -- bindings/c/include/wickra_backtest.h
            exit 1
          fi
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library next to the test assembly from
      # target/debug (see the <Content> items in the .csproj), so build it in the
      # debug profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-backtest-c
      - name: Test the C# binding
        run: dotnet test bindings/csharp/Wickra.Backtest.Tests/Wickra.Backtest.Tests.csproj -c Release
      # The example project references the binding project and copies the same
      # target/debug native library beside its own executable.
      - name: Run the C# example
        run: dotnet run --project examples/csharp -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # The binding loads the C ABI hub via the Java FFM API; the pom points
      # java.library.path at target/debug (the <native.lib.dir> property), so
      # build it in the debug profile here. The pom pins bytecode to release 25.
      - name: Build the C ABI library
        run: cargo build -p wickra-backtest-c
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Java info
        run: java -version
      - name: Test the Java binding
        run: mvn -B -f bindings/java test
      # examples/java resolves org.wickra:wickra-backtest from the local Maven
      # repository, so the binding has to be installed before the example can
      # compile against it. The tests ran in the step above; skip them here.
      - name: Install the Java binding locally
        run: mvn -B -f bindings/java install -DskipTests
      - name: Run the Java example
        run: mvn -B -f examples/java compile exec:exec

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    env:
      WKBT_INC: ${{ github.workspace }}/bindings/c/include
      WKBT_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      # The package compiles a thin .Call glue layer against the C ABI hub and
      # links -lwickra_backtest from WKBT_LIB; build the library first.
      - name: Build the C ABI library
        run: cargo build -p wickra-backtest-c --release
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time: LD_LIBRARY_PATH
        # (Linux), DYLD_LIBRARY_PATH (macOS) and PATH (Windows).
        run: |
          export WKBT_INC="${WKBT_INC//\\//}"
          export WKBT_LIB="${WKBT_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            # Windows (rtools bash): add the lib dir to PATH in msys form so the
            # ':' in the drive letter is not parsed as a PATH separator and msys
            # translates it to the Windows PATH the DLL loader searches.
            export PATH="$(cygpath -u "$WKBT_LIB"):$PATH"
          else
            export LD_LIBRARY_PATH="$WKBT_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKBT_LIB:$DYLD_LIBRARY_PATH"
          fi
          # golden.R parses the shared case corpus, and R has no JSON reader in
          # base. Declared in the package's Suggests so the dependency is
          # recorded rather than assumed to be on whatever machine runs it.
          Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite", repos = "https://cloud.r-project.org")'
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R
          Rscript bindings/r/tests/streaming.R
          Rscript bindings/r/tests/golden.R
          # The example reads examples/ relative to the working directory, which
          # is the repository root here.
          Rscript examples/r/backtest.R

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: >
          cargo llvm-cov
          -p wickra-backtest-core -p wickra-backtest-data
          -p wickra-backtest -p wickra-backtest-cli
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop: cap a wedged job instead of GitHub's 6h default (headroom for slow registry/package installs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: ./.github/actions/setup-rust
        with:
          # Pinned to a dated nightly so this job is reproducible: a rolling
          # `nightly` can break on an unrelated day for reasons that have nothing
          # to do with this code, and a fuzz smoke test that fails at random stops
          # being read. Same date as the indicator repository. Bump deliberately.
          toolchain: nightly-2026-07-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-fuzz

      # `fuzz run <target>` builds only the target it runs. All five are run
      # below, so today this step is redundant -- it is here so that a sixth
      # target added later and forgotten in the run list still gets compiled
      # against the core API instead of drifting unnoticed.
      - name: Build every fuzz target
        run: cargo +nightly-2026-07-01 fuzz build --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: Fuzz spec_parse (30 s)
        run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu spec_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz run_json (30 s)
        run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu run_json -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz engine_run (30 s)
        run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu engine_run -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz fill_model (30 s)
        run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu fill_model -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz data_loader (30 s)
        run: cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu data_loader -- -max_total_time=30
        working-directory: fuzz
