name: Benchmark

# The Criterion benchmark adds several minutes of build + bench time with no
# consumer of the resulting artefact, so it runs on a nightly schedule and on
# demand rather than gating every push / PR. ci.yml still verifies build / tests
# / lints on every push and pull-request.
on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch:
    inputs:
      size:
        description: "Number of bars per run (default 20000)"
        required: false
        default: "20000"
      repeat:
        description: "Timed repetitions, fastest wins (default 3)"
        required: false
        default: "3"

# Least-privilege default: the single job only builds and uploads an artifact.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  bench:
    name: Criterion benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the Criterion benchmark
        run: cargo bench -p wickra-backtest-bench | tee benchmark.txt
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.txt

  # The "versus other libraries" section of BENCHMARKS.md is the one claim in
  # this repository that cannot be checked by reading the code, and nothing ran
  # the harness that produces it. Peers are installed from a hash-locked lock
  # file, because a peer that fails to import is reported as "not installed" --
  # so an unpinned resolve would quietly reduce the comparison to a table of one.
  cross-library-bench:
    name: Cross-library benchmark report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      - name: Set up Python
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements/bench.txt
      - name: Wait before Python retry
        if: steps.setup_python.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-python failed (likely CDN flake), waiting 30s before retry..."
          sleep 30
      - name: Set up Python (retry)
        if: steps.setup_python.outcome == 'failure'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements/bench.txt

      - name: Install the peer libraries
        run: |
          # Hash-pinned (OpenSSF Scorecard PinnedDependencies). One Python
          # version here, so one lock file. Refresh with
          # scripts/update-lockfiles.sh.
          #
          # No `pip install --upgrade pip` first: that is itself an unpinned
          # install from the network, which is the thing this step is arranged to
          # avoid, and setup-python already provides a pip new enough for
          # --require-hashes.
          python -m pip install --require-hashes -r .github/requirements/bench.txt

      - name: Every peer imports
        # A peer that raises on import is indistinguishable from one that is not
        # installed: the harness skips both. Fail here instead, so the report
        # cannot come back shorter than it should be without anyone noticing.
        run: |
          python - <<'CHECK'
          import importlib, sys
          missing = []
          for name in ("backtrader", "vectorbt"):
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  # First line only: a plotly ValueError prints its entire
                  # property list, which would bury the finding in the log.
                  detail = str(exc).splitlines()[0] if str(exc) else ""
                  missing.append(f"{name}: {type(exc).__name__}: {detail}")
          if missing:
              print("::error::peer libraries did not import; the comparison would be incomplete")
              for line in missing:
                  print(f"  {line}")
              sys.exit(1)
          print("backtrader and vectorbt both import")
          CHECK

      - name: Build and install the wheel under test
        working-directory: bindings/python
        run: |
          maturin build --release --out dist
          python -m pip install --find-links dist --force-reinstall wickra-backtest

      - name: Run the cross-library benchmark
        working-directory: bindings/python
        # workflow_dispatch inputs are untrusted: pass them through the
        # environment and quote them rather than interpolating into the shell
        # (OpenSSF Scorecard: Dangerous-Workflow).
        env:
          BENCH_SIZE: ${{ github.event.inputs.size || '20000' }}
          BENCH_REPEAT: ${{ github.event.inputs.repeat || '3' }}
        run: |
          python -m benchmarks.compare_libraries             --size "$BENCH_SIZE" --repeat "$BENCH_REPEAT" | tee benchmark.txt

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-library-bench
          path: bindings/python/benchmark.txt
