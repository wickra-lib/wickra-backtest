# CodeQL configuration shared by every language in the matrix.
name: wickra-backtest

paths-ignore:
  # napi-rs generates the FFI glue in the Node binding: every exported class
  # gets a raw-pointer round trip that CodeQL reads as access-invalid-pointer.
  # The pointers come from Rust and are freed by Rust; the finding is a property
  # of the macro expansion, not of anything written here, and it fires once per
  # exported symbol. Analysing it would drown the real results.
  - bindings/node/src/lib.rs
  # Generated by napi build and committed; a drift check regenerates and diffs
  # them, so they are verified, just not by reading them.
  - bindings/node/index.js
  - bindings/node/index.d.ts

# examples/ is deliberately NOT ignored. Example code is what readers paste into
# their own programs, so a flaw there multiplies instead of staying contained --
# the first finding after C/C++ entered a matrix like this one was a command
# injection in an example, not in a binding.
