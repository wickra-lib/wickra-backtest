version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    # ureq is intentionally pinned to 2.x. ureq 3 unconditionally pulls
    # webpki-root-certs (CDLA-Permissive-2.0); the native-tls / OS-trust-store
    # setup deliberately avoids that licence (same precedent as wickra-data).
    # Block the major bump (2.x patch/minor still flow through).
    ignore:
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
      # schemars generates the committed StrategySpec schema, so ANY version
      # change to it is a change to the public contract callers write against.
      # The move from 0.8 to 1.x (0.1.9) was made that way: generate with
      # SchemaSettings::draft07() so the draft stays, rebless, and prove the new
      # schema describes the same specs (equal once enum[x]/const x, description
      # whitespace and required order are normalised). The next version is the
      # same deliberate step, so the hold stays on the dependency, not on an
      # update type: Dependabot classifies a 0.x minor as a minor update and
      # would propose it straight through a major-only hold.
      - dependency-name: "schemars"
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # The fuzz harness detaches itself from the workspace (cargo-fuzz builds it
  # with its own sanitizer flags), which also puts it outside the entry above and
  # outside `cargo deny`. libfuzzer-sys is a real external dependency with no
  # other watcher.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    # fuzz/Cargo.toml declares only libfuzzer-sys and two path dependencies, but
    # Dependabot follows those back into the root workspace -- so without these
    # this entry proposes changes to the root Cargo.toml that the entry above
    # forbids, and it did: a schemars bump that changes the committed
    # strategy-spec schema. The holds have to be stated wherever the manifest can
    # be reached from, not only where it is declared.
    ignore:
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "schemars"
    groups:
      fuzz:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    # The six per-platform packages are ours. They are optionalDependencies of
    # this one, versioned in lockstep by `napi version`, and never published
    # independently -- so Dependabot has nothing to find and its lookup fails
    # with a 404 on every run. They are not third-party dependencies to track.
    ignore:
      - dependency-name: "wickra-backtest-*"
    groups:
      node-binding:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # The hash-locked CI dev tooling. Nothing watched these before, so a advisory
  # against maturin or pytest would have sat in the tree unnoticed.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    # Version-update PRs disabled (0). The two files are resolved per target
    # Python by scripts/update-lockfiles.sh (uv honours each row's
    # --python-version); Dependabot edits the .txt directly and does not, so a
    # routine bump drops the 3.9 backports the floor row needs. Regenerate with
    # the script instead.
    #
    # The limit does not apply to SECURITY updates, and those need reading rather
    # than merging for the same reason. The pytest advisory produced one that
    # raised the 3.9 lock to a release requiring Python 3.10 -- unusable on the
    # row it edited -- and DOWNGRADED the 3.10+ lock, which was already past the
    # advisory. Five CI jobs failed. Check which file a security PR touches and
    # what the target interpreter can actually install before taking it.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-pip)"
    groups:
      ci-pip:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.86 for the
    # MSRV job, 1.88 for the Node binding), not an action version. Dependabot
    # misreads the channel as a version and proposes non-existent Rust releases
    # (e.g. 1.100). The toolchain pins are managed manually with the MSRV policy.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding (Maven) — tracks the C-ABI binding's build/publishing plugins.
  - package-ecosystem: maven
    directories:
      - "/bindings/java"
      # The benchmark is its own project with its own plugin versions.
      - "/bindings/java/benchmarks"
      # The example depends on org.json, which the binding does not -- an
      # external package that nothing was watching.
      - "/examples/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published Wickra.Backtest.csproj is a thin C-ABI
  # wrapper with no external packages; the test project pulls xunit and
  # Microsoft.NET.Test.Sdk.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/Wickra.Backtest.Tests"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Go binding (Go modules). The binding's own go.mod has no external deps but
  # Dependabot keeps the toolchain/directive current.
  - package-ecosystem: gomod
    directories:
      - "/bindings/go"
      # A separate module that `replace`s the binding with this tree's, so it is
      # not covered by the entry above.
      - "/examples/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]
