version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    # ureq is intentionally pinned to 2.x. ureq 3 unconditionally pulls
    # webpki-root-certs (CDLA-Permissive-2.0); the native-tls / OS-trust-store
    # setup deliberately avoids that licence (same precedent as wickra-data).
    # Block the major bump (2.x patch/minor still flow through).
    ignore:
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
      # schemars 1.x changes the generated JSON Schema draft, which would alter
      # the public StrategySpec schema output and break the committed golden
      # schema (a deliberate migration, not a routine bump). wickra does not use
      # schemars, so there is no version to align to. Hold at 0.x.
      - dependency-name: "schemars"
        update-types: ["version-update:semver-major"]
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # The fuzz harness detaches itself from the workspace (cargo-fuzz builds it
  # with its own sanitizer flags), which also puts it outside the entry above and
  # outside `cargo deny`. libfuzzer-sys is a real external dependency with no
  # other watcher.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(fuzz)"
    groups:
      fuzz:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # The hash-locked CI dev tooling. Nothing watched these before, so a advisory
  # against maturin or pytest would have sat in the tree unnoticed.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    # Version-update PRs disabled (0), security updates unaffected. The two files
    # are resolved per target Python by scripts/update-lockfiles.sh (uv honours
    # each row's --python-version); Dependabot edits the .txt directly and does
    # not, so a routine bump would drop the 3.9 backports the floor row needs.
    # Regenerate with the script; take the security PRs.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-pip)"
    groups:
      ci-pip:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.86 for the
    # MSRV job, 1.88 for the Node binding), not an action version. Dependabot
    # misreads the channel as a version and proposes non-existent Rust releases
    # (e.g. 1.100). The toolchain pins are managed manually with the MSRV policy.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding (Maven) — tracks the C-ABI binding's build/publishing plugins.
  - package-ecosystem: maven
    directories:
      - "/bindings/java"
      # The example depends on org.json, which the binding does not -- an
      # external package that nothing was watching.
      - "/examples/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published Wickra.Backtest.csproj is a thin C-ABI
  # wrapper with no external packages; the test project pulls xunit and
  # Microsoft.NET.Test.Sdk.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/Wickra.Backtest.Tests"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Go binding (Go modules). The binding's own go.mod has no external deps but
  # Dependabot keeps the toolchain/directive current.
  - package-ecosystem: gomod
    directories:
      - "/bindings/go"
      # A separate module that `replace`s the binding with this tree's, so it is
      # not covered by the entry above.
      - "/examples/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]
