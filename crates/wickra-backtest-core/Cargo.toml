[package]
name = "wickra-backtest-core"
description = "Streaming-native backtest engine core (strategy spec, rules, execution, portfolio) built on wickra-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
wickra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# docs.rs builds with every feature on, so the optional loaders are documented
# rather than silently absent. It builds on nightly with --cfg docsrs, which no
# job here can reproduce, so this is one of the few settings CI cannot verify.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
