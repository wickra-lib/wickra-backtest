[package]
name = "wickra-backtest-cli"
description = "Command-line backtester (wkbt) for the Wickra technical-indicator library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "wkbt"
path = "src/main.rs"

[dependencies]
wickra-backtest-core.workspace = true
wickra-backtest-data.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[features]
# Build `wkbt` with Apache Parquet loading (`wkbt run --data history.parquet`).
parquet = ["wickra-backtest-data/parquet"]
# Build `wkbt` with the Binance importer (`wkbt fetch`).
binance = ["wickra-backtest-data/binance"]

# docs.rs builds with every feature on, so the optional loaders are documented
# rather than silently absent. It builds on nightly with --cfg docsrs, which no
# job here can reproduce, so this is one of the few settings CI cannot verify.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
