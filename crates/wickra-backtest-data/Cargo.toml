[package]
name = "wickra-backtest-data"
description = "Data loaders (CSV / Parquet / JSONL) feeding the wickra-backtest engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
wickra-backtest-core.workspace = true
wickra-core.workspace = true
serde_json.workspace = true
parquet = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
proptest.workspace = true

[features]
# Apache Parquet bulk-history loading. Off by default — the arrow / parquet
# stack is heavy; opt in with `--features parquet` when you need it.
parquet = ["dep:parquet", "dep:arrow-array"]
# Fetch historical candles from the Binance REST API. Off by default (pulls an
# HTTP client). The response *parser* is always available and tested offline.
binance = ["dep:ureq"]
# Fetch JSON payloads from FXMacroData macro, FX, calendar, COT, commodity,
# curve, session and news endpoints.
fxmacrodata = ["dep:ureq"]

[lints]
workspace = true
