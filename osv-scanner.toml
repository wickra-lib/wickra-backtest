[[IgnoredVulns]]
id = "RUSTSEC-2026-0400"
reason = "a one-shot call on a context with an unfinished stream; parquet's zstd::bulk contexts only ever run one-shot calls, never a stream. Remove with parquet 60."

[[IgnoredVulns]]
