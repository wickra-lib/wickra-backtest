# Single source of truth for repo-level identity (org slug, maintainer email,
# canonical URLs). Mirrors the convention used in the main `wickra` repository.

[repo]
org          = "wickra-lib"
name         = "wickra-backtest"
url          = "https://github.com/wickra-lib/wickra-backtest"
docs_url     = "https://backtest.wickra.org"
homepage     = "https://wickra.org"
issues_url   = "https://github.com/wickra-lib/wickra-backtest/issues"
discussions  = "https://github.com/wickra-lib/wickra-backtest/discussions"
security_url = "https://github.com/wickra-lib/wickra-backtest/security/advisories/new"

[maintainer]
# `handle` is the natural-person credit shown in package manifests; it does not
# move with a GitHub org transfer. `github` is the org @-mention slug used in
# CODEOWNERS and prose.
handle = "kingchenc"
email  = "support@wickra.org"
github = "wickra-lib"

[badges]
codecov_repo = "wickra-lib/wickra-backtest"
ci_workflow  = "ci.yml"

[audit]
# Forbidden substrings that must not appear in source: the pre-org-migration
# repo paths. `kingchenc/wickra` subsumes `kingchenc/wickra-backtest` and also
# catches a stale link to the sibling indicator repository, which this one points
# at from every binding README and badge -- the likelier mistake of the two, and
# the one the narrower needle let through.
forbidden = [
    "kingchenc/wickra",
]

# Paths exempt from the forbidden-substring scan: auto-generated / lockfiles and
# the two files that legitimately spell the forbidden value out (this file
# defines it; the audit script matches against it).
allowlist = [
    "target/",
    "node_modules/",
    "fuzz/target/",
    ".venv/",
    "Cargo.lock",
    "package-lock.json",
    "bindings/node/index.js",
    "bindings/node/index.d.ts",
    "repo-metadata.toml",
    ".github/scripts/sync-metadata.py",
]
